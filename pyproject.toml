[project]
name = "permplaces"
version = "0.2.0"
description = "Telegram city places assistant for Perm"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
