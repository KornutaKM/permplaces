name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build bot
      - run: docker image inspect permplaces:local --format '{{json .Config.Healthcheck}}' | grep -q '/health/ready'
      - run: test "$(docker image inspect permplaces:local --format '{{.Config.User}}')" = "10001:10001"
      - run: test "$(docker compose run --rm --no-deps bot id -u)" = "10001"
      - run: docker compose run --rm --no-deps bot python -c "from pathlib import Path; p=Path('/app/data/ci-write-test'); p.write_text('ok'); p.unlink(); print('data-write-ok')"
      - run: |
          if docker compose run --rm --no-deps bot sh -c 'touch /app/should-not-write'; then
            echo "read-only root filesystem check unexpectedly succeeded"
            exit 1
          fi
      - run: docker compose run --rm --no-deps bot python -m app.backup --help
      - run: docker compose run --rm --no-deps bot python -c "import app.main; print('compose-smoke-ok')"
