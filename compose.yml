services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: permplaces:local
    env_file:
      - .env
    expose:
      - "${HEALTH_PORT:-8080}"
    volumes:
      - permplaces-data:/app/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

volumes:
  permplaces-data:
